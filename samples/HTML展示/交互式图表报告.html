<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>交互式图表报告 · NoteVault 示例</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; background: #17181c; color: #e8e9ec; padding: 32px 24px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 24px; margin-bottom: 4px; }
  .sub { color: #9aa0a8; font-size: 13px; margin-bottom: 28px; }
  .card { background: #1f2128; border: 1px solid #2c2f38; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  .card h2 { font-size: 15px; color: #c6cbd3; margin-bottom: 12px; }
  canvas { width: 100%; display: block; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; }
  button {
    background: #2a2d36; color: #e8e9ec; border: 1px solid #3a3e4a; border-radius: 8px;
    padding: 7px 14px; font-size: 13px; cursor: pointer; transition: background .15s;
  }
  button:hover { background: #353a45; }
  button.on { background: #6d5bd0; border-color: #6d5bd0; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .kpi { background: #1f2128; border: 1px solid #2c2f38; border-radius: 12px; padding: 14px; }
  .kpi b { font-size: 20px; display: block; }
  .kpi span { font-size: 12px; color: #9aa0a8; }
  .kpi em { font-style: normal; font-size: 11px; margin-left: 6px; }
  .up { color: #4ade80; } .down { color: #f87171; }
</style>
</head>
<body>
<div class="wrap">
  <h1>交互式图表报告</h1>
  <p class="sub">内联 JavaScript + Canvas（无 CDN 依赖，离线可用）—— 验证 iframe 完整脚本执行能力</p>

  <div class="kpis" id="kpis"></div>

  <div class="card">
    <h2>周渲染调用量（点击按钮切换数据集）</h2>
    <div class="toolbar">
      <button id="btn-week" class="on">近 7 天</button>
      <button id="btn-month">近 30 天</button>
      <button id="btn-random">随机数据</button>
    </div>
    <canvas id="line" height="240"></canvas>
  </div>

  <div class="card">
    <h2>文档类型占比（hover 查看数值）</h2>
    <canvas id="pie" height="240"></canvas>
  </div>
</div>

<script>
// ---------- 数据 ----------
const week = { labels: ['周一','周二','周三','周四','周五','周六','周日'], data: [42, 58, 51, 73, 66, 31, 24] };
const month = { labels: Array.from({length: 30}, (_, i) => 'D' + (i + 1)),
  data: Array.from({length: 30}, (_, i) => 30 + Math.round(40 * Math.sin(i / 3) + (i * 37 % 23))) };
let ds = week;

// ---------- KPI ----------
function renderKpis() {
  const total = ds.data.reduce((a, b) => a + b, 0);
  const avg = Math.round(total / ds.data.length);
  const peak = Math.max(...ds.data);
  const el = document.getElementById('kpis');
  el.innerHTML = `
    <div class="kpi"><b>${total}</b><span>总调用量</span><em class="up">▲</em></div>
    <div class="kpi"><b>${avg}</b><span>日均</span></div>
    <div class="kpi"><b>${peak}</b><span>峰值</span></div>
    <div class="kpi"><b>${ds.labels.length}</b><span>采样天数</span></div>`;
}

// ---------- Canvas 折线图 ----------
const lineCv = document.getElementById('line');
const dpr = window.devicePixelRatio || 1;
function setupCanvas(cv, hCss) {
  const w = cv.clientWidth;
  cv.width = w * dpr; cv.height = hCss * dpr;
  cv.style.height = hCss + 'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h: hCss };
}
function drawLine() {
  const { ctx, w, h } = setupCanvas(lineCv, 240);
  const pad = { l: 40, r: 16, t: 16, b: 28 };
  const max = Math.max(...ds.data) * 1.15;
  const xs = i => pad.l + (w - pad.l - pad.r) * i / (ds.data.length - 1);
  const ys = v => pad.t + (h - pad.t - pad.b) * (1 - v / max);
  ctx.clearRect(0, 0, w, h);
  // grid
  ctx.strokeStyle = '#2c2f38'; ctx.fillStyle = '#7c828c'; ctx.font = '11px sans-serif';
  for (let g = 0; g <= 4; g++) {
    const v = max * g / 4, y = ys(v);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillText(Math.round(v), 6, y + 4);
  }
  // x labels (sparse)
  const step = Math.ceil(ds.labels.length / 10);
  ds.labels.forEach((lb, i) => { if (i % step === 0) ctx.fillText(lb, xs(i) - 10, h - 8); });
  // area + line
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, 'rgba(139,123,255,.35)'); grad.addColorStop(1, 'rgba(139,123,255,0)');
  ctx.beginPath();
  ds.data.forEach((v, i) => i ? ctx.lineTo(xs(i), ys(v)) : ctx.moveTo(xs(i), ys(v)));
  ctx.strokeStyle = '#8b7bff'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.lineTo(xs(ds.data.length - 1), ys(0)); ctx.lineTo(xs(0), ys(0)); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();
  // points
  ds.data.forEach((v, i) => { ctx.beginPath(); ctx.arc(xs(i), ys(v), 3, 0, 7); ctx.fillStyle = '#8b7bff'; ctx.fill(); });
}
lineCv.addEventListener('mousemove', e => {
  drawLine();
  const rect = lineCv.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const pad = { l: 40, r: 16 };
  const idx = Math.round((x - pad.l) / (lineCv.clientWidth - pad.l - pad.r) * (ds.data.length - 1));
  if (idx >= 0 && idx < ds.data.length) {
    const ctx = lineCv.getContext('2d');
    const max = Math.max(...ds.data) * 1.15;
    const px = pad.l + (lineCv.clientWidth - pad.l - pad.r) * idx / (ds.data.length - 1);
    const py = 16 + (240 - 16 - 28) * (1 - ds.data[idx] / max);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.strokeStyle = '#4b5568'; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(px, 16); ctx.lineTo(px, 212); ctx.stroke(); ctx.setLineDash([]);
    const label = `${ds.labels[idx]}: ${ds.data[idx]}`;
    ctx.font = 'bold 12px sans-serif';
    const tw = ctx.measureText(label).width + 14;
    const bx = Math.min(Math.max(px - tw / 2, 2), lineCv.clientWidth - tw - 2);
    ctx.fillStyle = '#0e0f13'; ctx.strokeStyle = '#3a3e4a';
    ctx.beginPath(); ctx.roundRect(bx, py - 30, tw, 22, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e8e9ec'; ctx.fillText(label, bx + 7, py - 15);
  }
});
lineCv.addEventListener('mouseleave', drawLine);

// ---------- Canvas 饼图 ----------
const pieData = [
  { label: 'Markdown', value: 78, color: '#8b7bff' },
  { label: 'HTML', value: 15, color: '#4cc38a' },
  { label: '其他', value: 7, color: '#f0b45c' },
];
const pieCv = document.getElementById('pie');
let hoverSlice = -1;
function drawPie() {
  const { ctx, w, h } = setupCanvas(pieCv, 240);
  const cx = w * 0.38, cy = h / 2, R = Math.min(w, h) / 2 - 24;
  const total = pieData.reduce((a, b) => a + b.value, 0);
  let ang = -Math.PI / 2;
  pieData.forEach((d, i) => {
    const a2 = ang + Math.PI * 2 * d.value / total;
    const hot = i === hoverSlice;
    const r = hot ? R + 6 : R;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, r, ang, a2); ctx.closePath();
    ctx.fillStyle = d.color; ctx.globalAlpha = hoverSlice === -1 || hot ? 1 : .45;
    ctx.fill(); ctx.globalAlpha = 1;
    const mid = (ang + a2) / 2;
    ctx.fillStyle = '#0e0f13';
    ctx.font = 'bold 12px sans-serif';
    if (hot) {
      ctx.fillText(Math.round(d.value / total * 100) + '%', cx + Math.cos(mid) * r * 0.6 - 12, cy + Math.sin(mid) * r * 0.6 + 4);
    }
    ang = a2;
  });
  // legend
  ctx.font = '13px sans-serif';
  pieData.forEach((d, i) => {
    const y = 40 + i * 26;
    ctx.fillStyle = d.color; ctx.fillRect(w * 0.68, y - 11, 12, 12);
    ctx.fillStyle = '#c6cbd3';
    ctx.fillText(`${d.label}（${d.value}）`, w * 0.68 + 20, y);
  });
}
pieCv.addEventListener('mousemove', e => {
  const rect = pieCv.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const cx = rect.width * 0.38, cy = rect.height / 2;
  const dx = x - cx, dy = y - cy;
  const dist = Math.hypot(dx, dy);
  const R = Math.min(rect.width, rect.height) / 2 - 24;
  hoverSlice = -1;
  if (dist <= R + 8) {
    const total = pieData.reduce((a, b) => a + b.value, 0);
    let ang = Math.atan2(dy, dx) + Math.PI / 2;
    if (ang < -Math.PI / 2) ang += Math.PI * 2;
    let acc = -Math.PI / 2;
    pieData.forEach((d, i) => {
      const a2 = acc + Math.PI * 2 * d.value / total;
      if (ang >= acc && ang < a2) hoverSlice = i;
      acc = a2;
    });
  }
  drawPie();
});
pieCv.addEventListener('mouseleave', () => { hoverSlice = -1; drawPie(); });

// ---------- 控件 ----------
function setDs(d) { ds = d; renderKpis(); drawLine(); }
document.getElementById('btn-week').onclick = e => { mark(e); setDs(week); };
document.getElementById('btn-month').onclick = e => { mark(e); setDs(month); };
document.getElementById('btn-random').onclick = e => {
  mark(e);
  setDs({ labels: week.labels, data: week.data.map(() => 10 + Math.round(Math.random() * 90)) });
};
function mark(e) {
  document.querySelectorAll('button').forEach(b => b.classList.remove('on'));
  e.target.classList.add('on');
}

window.addEventListener('resize', () => { drawLine(); drawPie(); });
renderKpis(); drawLine(); drawPie();
</script>
</body>
</html>
