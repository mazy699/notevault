[package]
name = "notevault"
version = "0.7.2"
description = "NoteVault - AI 文档笔记查看器（Markdown / Mermaid / HTML）"
edition = "2021"

[lib]
name = "notevault_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
scrypt = { version = "0.11", default-features = false, features = ["std"] }
aes-gcm = { version = "0.10", default-features = false, features = ["std", "aes"] }
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
ureq = { version = "2", default-features = false, features = ["native-tls"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
